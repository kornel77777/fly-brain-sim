[project]
name = "fly-brain-sim"
version = "0.1.0"
description = "Visualize and simulate the Drosophila whole-brain connectome (FlyWire FAFB v783)"
readme = "README.md"
authors = [
    { name = "kornel", email = "146144566+kornel77777@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
